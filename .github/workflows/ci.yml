name: CI
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install anthropic numpy pytest
      - name: Test variant runner schema
        run: |
          python - <<'PYEOF'
          from optimizers.variant_runner import PromptVariant, EvalSample
          v = PromptVariant('test', 'sys', 'Answer: {input}')
          assert v.render('hello') == 'Answer: hello'
          print('variant OK')
          PYEOF
      - name: Test few-shot example
        run: |
          python - <<'PYEOF'
          from optimizers.few_shot_optimizer import FewShotExample
          e = FewShotExample('input text', 'output text')
          assert 'input text' in e.format()
          print('few_shot OK')
          PYEOF
